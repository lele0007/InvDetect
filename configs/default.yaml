seed: 0

paths:
  train_dir: data/train/normal
  test_dir: data/test
  masks_dir: data/masks
  diffusion_checkpoint: artifacts/diffusion.pt
  classifier_checkpoint: artifacts/classifier.joblib
  predictions_csv: outputs/patch_predictions.csv
  reconstruction_dir: outputs/reconstructed

data:
  channels: 1

diffusion:
  base_channels: 32
  timesteps: 100
  epochs: 100
  batch_size: 32
  learning_rate: 0.001

classifier:
  batch_size: 32
  nu: 0.1

reconstruction:
  threshold: 0.0

dice:
  threshold: 127

runtime:
  device: auto
  num_workers: 0
